name: WhisperWake
options:
  bundleIdPrefix: com.addvalue
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
targets:
  WhisperWake:
    type: application
    platform: iOS
    sources: [WhisperWake]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.addvalue.whisperwake
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Whisper Wake
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 내 목소리로 알람 메시지를 녹음하기 위해 마이크를 사용합니다.
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: 오늘의 일정을 아침에 읽어드리기 위해 캘린더를 사용합니다.
        INFOPLIST_KEY_UIBackgroundModes: audio
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
